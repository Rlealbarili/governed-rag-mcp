name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: make setup
      - name: CIRES gates
        run: make ci
      - name: Build container
        run: docker build --tag governed-rag-mcp:ci .
      - name: Smoke hardened container
        run: >-
          docker run --rm --read-only --network none --cap-drop ALL
          --security-opt no-new-privileges=true --entrypoint python governed-rag-mcp:ci
          -c "import os; from pathlib import Path; from governed_rag_mcp.embeddings import
          HashingEmbedder; from governed_rag_mcp.service import SearchService; status =
          SearchService(index_path=Path('/app/data/knowledge.sqlite'),
          embedder=HashingEmbedder()).status(); raise SystemExit(0 if os.getuid() == 10001 and
          status['status'] == 'PASS' else 1)"
